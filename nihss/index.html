    .portal-nav {

      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0.5rem 1rem;
      display: flex;

      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .portal-nav a {
      color: #94a3b8;

      font-weight: 500;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .portal-nav-links {

    .portal-nav-links a {

      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .portal-nav-links a:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .cards-wrapper-outer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 20px 0;
      background: #f3f1f6;
      min-height: calc(100vh - 50px);
    }
    @media (max-width: 850px) {
      .portal-nav {
        flex-direction: column;
        align-items: stretch;
      }
      .portal-nav-links {
        justify-content: flex-start;
        gap: 0.4rem;
      }
      .portal-nav-links a {
        flex: 1 1 auto;
        text-align: center;
        padding: 0.4rem 0.2rem;
        font-size: 0.75rem;
      }
      .cards-wrapper-outer {
        padding: 0;
        gap: 0;
        background: #ffffff;
      }
    }
    @media print {
      .portal-nav {
        display: none !important;
      }
      .cards-wrapper-outer {
        padding: 0 !important;
        background: #ffffff !important;
        gap: 0 !important;
      }
      .card-wrapper {
        page-break-after: always;
        break-after: page;
        margin-bottom: 0 !important;
      }
    }
  </style>

  <script>
    // Copy template utility for bedside consent template
    document.addEventListener("DOMContentLoaded", function() {
      const template = document.querySelector(".copyable-template");
      if (template) {
        template.addEventListener("click", function() {
          const text = this.innerText.replace(/COPY TEMPLATE/g, "").trim();
          navigator.clipboard.writeText(text).then(() => {
            const badge = this.querySelector(".copy-badge");
            if (badge) {
              badge.classList.add("copied");
              badge.innerText = "Copied!";
              setTimeout(() => {
                badge.classList.remove("copied");
                badge.innerText = "Copy Template";
              }, 2000);
            }
          }).catch(err => {
            console.error("Clipboard error:", err);
          });
        });
      }
    });
  </script>
